<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MMM-LiveRadar preview</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="MMM-LiveRadar.css">
  <style>body{margin:0;background:#000;padding:32px;display:flex;justify-content:center}#radar{max-width:100%}.preview-caption{color:#789083;font:11px Arial,sans-serif;margin-bottom:24px}.preview-caption a{color:#b1d5c2}</style>
</head>
<body>
  <main id="radar"><p class="preview-caption">MMM-LiveRadar · standalone preview · <a href="https://adsb.fi/">adsb.fi</a></p></main>
  <script src="vendor/leaflet.js"></script>
  <script>
    window.Module = { register(name, definition) { window.radar = definition; } };
  </script>
  <script src="MMM-LiveRadar.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    radar.identifier = "preview";
    radar.config = {
      ...radar.defaults,
      useMapTiles: params.get("tiles") !== "0",
      layout: params.get("layout") === "landscape" ? "landscape" : "portrait",
      fullscreen: params.get("fullscreen") === "1",
      infoSide: params.get("side") === "left" ? "left" : "right"
    };
    radar.file = name => name;
    radar.sendSocketNotification = () => {};
    radar.start();
    document.getElementById("radar").appendChild(radar.getDom());
    radar.notificationReceived("DOM_OBJECTS_CREATED");
    if (params.get("offline") !== "1") {
      const source = new EventSource("events");
      source.onmessage = event => {
        const message = JSON.parse(event.data);
        radar.socketNotificationReceived(message.notification, { ...message.payload, id: "preview" });
      };
      source.onerror = () => { radar.status = {state:"retry",message:"Preview server disconnected; reconnecting"}; radar.renderData(); };
    }
  </script>
</body>
</html>
